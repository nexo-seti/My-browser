name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/mybrowser/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyBrowser"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mybrowser.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mybrowser.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Мой браузер"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mybrowser/app/MainActivity.java <<'EOF'
          package com.mybrowser.app;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.Spinner;

          public class MainActivity extends Activity {
              private WebView web;
              private EditText urlbar;
              private EditText homeSearch;
              private Spinner engine;
              private LinearLayout home;
              private LinearLayout browser;
              private FrameLayout root;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  float d = getResources().getDisplayMetrics().density;

                  root = new FrameLayout(this);
                  root.setPadding(0, (int) (d * 24), 0, 0);

                  // ---------- Стартовый экран: только строка поиска и выбор поисковика ----------
                  home = new LinearLayout(this);
                  home.setOrientation(LinearLayout.VERTICAL);
                  home.setGravity(Gravity.CENTER);
                  home.setPadding((int) (d * 16), 0, (int) (d * 16), 0);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);

                  homeSearch = new EditText(this);
                  homeSearch.setHint("Поиск");
                  homeSearch.setSingleLine(true);
                  homeSearch.setInputType(InputType.TYPE_TEXT_VARIATION_URI);
                  homeSearch.setImeOptions(EditorInfo.IME_ACTION_SEARCH);
                  homeSearch.setOnEditorActionListener((v, actionId, event) -> {
                      search(homeSearch.getText().toString());
                      return true;
                  });

                  engine = new Spinner(this);
                  engine.setAdapter(new ArrayAdapter<String>(this,
                          android.R.layout.simple_spinner_dropdown_item,
                          new String[]{"Яндекс", "Google"}));

                  row.addView(homeSearch, new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  row.addView(engine, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  home.addView(row, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));

                  // ---------- Браузер (как был) ----------
                  browser = new LinearLayout(this);
                  browser.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);

                  Button back = new Button(this);
                  back.setText("<-");
                  back.setOnClickListener(v -> { if (web.canGoBack()) web.goBack(); });

                  Button next = new Button(this);
                  next.setText("->");
                  next.setOnClickListener(v -> { if (web.canGoForward()) web.goForward(); });

                  Button reload = new Button(this);
                  reload.setText("<°>");
                  reload.setOnClickListener(v -> web.reload());

                  urlbar = new EditText(this);
                  urlbar.setSingleLine(true);
                  urlbar.setInputType(InputType.TYPE_TEXT_VARIATION_URI);
                  urlbar.setImeOptions(EditorInfo.IME_ACTION_GO);
                  urlbar.setOnEditorActionListener((v, actionId, event) -> {
                      search(urlbar.getText().toString());
                      return true;
                  });

                  bar.addView(back, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  bar.addView(next, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  bar.addView(reload, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  bar.addView(urlbar, new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          urlbar.setText(url);
                          urlbar.setSelection(0);
                      }
                  });

                  browser.addView(bar, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  browser.addView(web, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  root.addView(home, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  root.addView(browser, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  showHome();
              }

              private void showHome() {
                  browser.setVisibility(View.GONE);
                  home.setVisibility(View.VISIBLE);
                  homeSearch.setText("");
              }

              private void showBrowser() {
                  home.setVisibility(View.GONE);
                  browser.setVisibility(View.VISIBLE);
                  InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(root.getWindowToken(), 0);
              }

              private void search(String text) {
                  text = text.trim();
                  if (text.isEmpty()) return;
                  String url;
                  if (text.startsWith("http://") || text.startsWith("https://")) {
                      url = text;
                  } else if (text.contains(".") && !text.contains(" ")) {
                      url = "https://" + text;
                  } else if (engine.getSelectedItemPosition() == 0) {
                      url = "https://yandex.ru/search/?text=" + android.net.Uri.encode(text);
                  } else {
                      url = "https://www.google.com/search?q=" + android.net.Uri.encode(text);
                  }
                  showBrowser();
                  web.loadUrl(url);
              }

              @Override
              public void onBackPressed() {
                  if (browser.getVisibility() == View.VISIBLE) {
                      if (web.canGoBack()) web.goBack();
                      else showHome();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyBrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk
